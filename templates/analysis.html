<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Analysis Report</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-okaidia.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="analysis-view">
    <div class="container-fluid mt-4">
        <!-- Header -->
        <div class="py-3 px-4 mb-4 bg-success text-white rounded shadow-sm d-flex justify-content-between align-items-center">
            <h2>Side-by-Side Analysis</h2>
            <!-- NEW: Download Button. It starts disabled. -->
            <button id="download-zip-btn" class="btn btn-light" disabled>
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-download" viewBox="0 0 16 16">
                    <path d="M.5 9.9a.5.5 0 0 1 .5.5v2.5a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-2.5a.5.5 0 0 1 1 0v2.5a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2v-2.5a.5.5 0 0 1 .5-.5z"/>
                    <path d="M7.646 11.854a.5.5 0 0 0 .708 0l3-3a.5.5 0 0 0-.708-.708L8.5 10.293V1.5a.5.5 0 0 0-1 0v8.793L5.354 8.146a.5.5 0 1 0-.708.708l3 3z"/>
                </svg>
                Download Reports (.zip)
            </button>
        </div>

        <!-- Main Content Row -->
        <div class="row">
            <!-- Left Column: Raw Report -->
            <div class="col-md-6">
                <div class="card shadow-sm">
                    <div class="card-header">
                        <strong>Raw pt-query-digest Report</strong>
                    </div>
                    <div class="card-body">
                        <pre id="raw-report-container"><code class="language-bash">Loading raw report...</code></pre>
                    </div>
                </div>
            </div>

            <!-- Right Column: AI Analysis -->
            <div class="col-md-6">
                <div class="card shadow-sm">
                    <div class="card-header">
                        <strong>AI-Generated Analysis</strong>
                    </div>
                    <div id="ai-analysis-container" class="card-body">
                        <div class="d-flex justify-content-center align-items-center h-100">
                            <div class="spinner-border text-success" role="status">
                                <span class="visually-hidden">Loading...</span>
                            </div>
                            <strong class="ms-3">Generating analysis, please wait...</strong>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-core.min.js"></script>
	<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/autoloader/prism-autoloader.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- NEW: Add the JSZip library from a CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="{{ url_for('static', filename='analysis.js') }}"></script>
</body>
</html>
