<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RDS Slow Query Log Analyzer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-okaidia.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container mt-4">
        <!-- Main Header -->
        <div class="py-3 px-4 mb-4 bg-primary text-white rounded shadow-sm">
            <h2>RDS Slow Query Log Analyzer</h2>
        </div>

        <!-- Main two-column layout row -->
        <div class="row">

            <!-- ======================================= -->
            <!-- ==         LEFT COLUMN (INPUT)         == -->
            <!-- ======================================= -->
            <div class="col-md-4">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <form id="analysis-form">
                            <div class="mb-3">
                                <label for="db-instances" class="form-label">Select DB Instance(s)</label>
                                <select multiple class="form-control" id="db-instances" required size="10">
                                    {% for instance in db_instances %}
                                        <option value="{{ instance }}">{{ instance }}</option>
                                    {% endfor %}
                                </select>
                                <div class="form-text">Hold Ctrl (or Cmd on Mac) to select multiple.</div>
                            </div>
                            <div class="row">
                                <div class="col-12 mb-3">
                                    <label for="start-date" class="form-label">Start Date</label>
                                    <input type="date" class="form-control" id="start-date" required>
                                </div>
                                <div class="col-12 mb-3">
                                    <label for="end-date" class="form-label">End Date</label>
                                    <input type="date" class="form-control" id="end-date" required>
                                </div>
                            </div>
                            <button type="submit" class="btn btn-primary w-100" id="submit-btn" {% if not db_instances %}disabled{% endif %}>
                                <span id="btn-text">Start Analysis</span>
                                <div class="spinner-border spinner-border-sm d-none" id="btn-spinner" role="status">
                                    <span class="visually-hidden">Loading...</span>
                                </div>
                            </button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- ========================================= -->
            <!-- ==         RIGHT COLUMN (OUTPUT)         == -->
            <!-- ========================================= -->
            <div class="col-md-8">
                <!-- The status and results containers now live in the right column -->
                <div id="status-container" class="mt-4 mt-md-0 d-none">
                    <div class="card">
                        <div class="card-body">
                            <h5 class="card-title">Analysis Progress</h5>
                            <div class="progress mb-2" role="progressbar">
                                <div class="progress-bar progress-bar-striped progress-bar-animated" style="width: 100%"></div>
                            </div>
                            <p id="status-message" class="text-muted mb-0">Starting...</p>
                        </div>
                    </div>
                </div>

                <div id="results-container" class="mt-4 mt-md-0 d-none">
                    <!-- The JavaScript will insert report content here -->
                </div>
            </div>

        </div> <!-- End of .row -->
    </div> <!-- End of .container -->

    <!-- Scripts at the end of the body -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-core.min.js"></script>
	<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/autoloader/prism-autoloader.min.js"></script>
    <!-- NEW: Add marked.js for rendering AI's Markdown response -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
